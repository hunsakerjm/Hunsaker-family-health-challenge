# Standalone Worker for scheduled D1 -> R2 backups.
#
# This is NOT part of the Pages project (../wrangler.toml) and is NOT deployed.
# Cloudflare Pages Functions have no scheduled/cron handler today (verified against
# developers.cloudflare.com/pages/functions/bindings/ and
# developers.cloudflare.com/workers/configuration/cron-triggers/, 2026-08-24 — Cron
# Triggers are documented only for standalone Workers, using the `[triggers]` key
# below, which Pages projects do not support). A scheduled export therefore requires
# its own Worker, deployed separately with `wrangler deploy` (not `wrangler pages
# deploy`). See backup/README.md before running anything here.
name = "hunsaker-family-backup"
main = "src/index.ts"
compatibility_date = "2026-08-23"

# Same production database as the Pages project (../wrangler.toml). A D1 database
# can be bound by more than one Worker; this does not change or move the data, and
# does not affect the Pages project's own binding.
[[d1_databases]]
binding = "DB"
database_name = "health-challenge"
database_id = "3f848810-e935-4796-aefe-1d3dce54ab49"

# Owner action required before first deploy — this bucket does not exist yet:
#   npx wrangler r2 bucket create hunsaker-family-backups
# Then uncomment the block below. Until it's uncommented and the bucket is real,
# this Worker will fail at deploy time (missing binding), which is the point —
# it should not be deployable by accident.
# [[r2_buckets]]
# binding = "BACKUP_BUCKET"
# bucket_name = "hunsaker-family-backups"

# Every Sunday at 09:00 UTC (~01:00-02:00 America/Los_Angeles depending on DST) —
# late night/early morning Pacific, matching the "weekly, low-traffic" intent of
# spec §12. Cron Trigger schedules are always evaluated in UTC.
[triggers]
crons = ["0 9 * * 0"]

# Optional: how many backups to keep in R2 before pruning the oldest (see
# src/index.ts). Defaults to 26 (roughly six months of weekly backups) if unset.
# [vars]
# BACKUP_RETENTION_COUNT = "26"
